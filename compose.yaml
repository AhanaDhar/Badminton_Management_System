services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  backend:
    build: .
    environment:
      DATABASE_URL: ""
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ACADEMY_TIMEZONE: ${ACADEMY_TIMEZONE:-Asia/Kolkata}
      ACADEMY_CURRENCY: ${ACADEMY_CURRENCY:-INR}
    depends_on:
      db:
        condition: service_healthy
    # Migrations/admin provisioning are explicit setup steps in the README.
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "60", "backend:create_app()"]
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
  frontend:
    build: .
    environment:
      API_URL: http://backend:5000/api
    depends_on:
      - backend
    command: ["streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
volumes:
  mysql_data:
